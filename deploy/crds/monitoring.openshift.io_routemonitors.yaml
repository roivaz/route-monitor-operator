---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: routemonitors.monitoring.openshift.io
spec:
  group: monitoring.openshift.io
  names:
    kind: RouteMonitor
    listKind: RouteMonitorList
    plural: routemonitors
    singular: routemonitor
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RouteMonitor is the Schema for the routemonitors API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RouteMonitorSpec defines the desired state of RouteMonitor
            properties:
              domainRef:
                description: |-
                  ClusterDomainRef defines the object used determine the cluster's domain
                  By default, 'infra' is used, which references the 'infrastructures/cluster' object
                enum:
                - infra
                - hcp
                type: string
              insecureSkipTLSVerify:
                description: |-
                  InsecureSkipTLSVerify indicates that the blackbox exporter module used to probe this route
                  should *not* use https
                type: boolean
              relabelConfigs:
                description: |-
                  RelabelConfigs allows users to customize ServiceMonitor metric relabel configurations.
                  If specified, these will override the default relabel configs entirely.
                items:
                  description: |-
                    RelabelConfig allows dynamic rewriting of the label set, being applied to samples before ingestion.
                    It defines `<metric_relabel_configs>`-section of Prometheus configuration.
                    More info: https://prometheus.io/docs/prometheus/latest/configuration/configuration/#metric_relabel_configs
                  properties:
                    action:
                      default: replace
                      description: |-
                        Action to perform based on regex matching. Default is 'replace'.
                        uppercase and lowercase actions require Prometheus >= 2.36.
                      enum:
                      - replace
                      - Replace
                      - keep
                      - Keep
                      - drop
                      - Drop
                      - hashmod
                      - HashMod
                      - labelmap
                      - LabelMap
                      - labeldrop
                      - LabelDrop
                      - labelkeep
                      - LabelKeep
                      - lowercase
                      - Lowercase
                      - uppercase
                      - Uppercase
                      type: string
                    modulus:
                      description: Modulus to take of the hash of the source label
                        values.
                      format: int64
                      type: integer
                    regex:
                      description: Regular expression against which the extracted
                        value is matched. Default is '(.*)'
                      type: string
                    replacement:
                      description: |-
                        Replacement value against which a regex replace is performed if the
                        regular expression matches. Regex capture groups are available. Default is '$1'
                      type: string
                    separator:
                      description: Separator placed between concatenated source label
                        values. default is ';'.
                      type: string
                    sourceLabels:
                      description: |-
                        The source labels select values from existing labels. Their content is concatenated
                        using the configured separator and matched against the configured regular expression
                        for the replace, keep, and drop actions.
                      items:
                        description: LabelName is a valid Prometheus label name which
                          may only contain ASCII letters, numbers, as well as underscores.
                        pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                        type: string
                      type: array
                    targetLabel:
                      description: |-
                        Label to which the resulting value is written in a replace action.
                        It is mandatory for replace actions. Regex capture groups are available.
                      type: string
                  type: object
                type: array
              route:
                description: Route specifies the Route resource that should be monitored
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                  port:
                    description: Port optionally defines the port we should use while
                      probing
                    format: int64
                    minimum: 1
                    type: integer
                  suffix:
                    description: Suffix optionally defines the path we should probe
                      (/livez /readyz etc)
                    type: string
                required:
                - name
                - namespace
                type: object
              serviceMonitorType:
                description: ServiceMonitorType dictates the type of ServiceMonitor
                  the RouteMonitor should create
                enum:
                - monitoring.coreos.com
                - monitoring.rhobs
                type: string
              skipPrometheusRule:
                description: |-
                  SkipPrometheusRule instructs the controller to skip the creation of PrometheusRule CRs.
                  One common use-case for is for alerts that are defined separately, such as for hosted clusters.
                type: boolean
              slo:
                description: Service level objective for the monitor
                properties:
                  targetAvailabilityPercent:
                    description: TargetAvailabilityPercent defines the percent number
                      to be used
                    type: string
                required:
                - targetAvailabilityPercent
                type: object
            required:
            - route
            type: object
          status:
            description: RouteMonitorStatus defines the observed state of RouteMonitor
            properties:
              errorStatus:
                description: ErrorStatus contains error information if the RouteMonitor
                  is in an error state
                type: string
              prometheusRuleRef:
                description: PrometheusRuleRef contains the reference to the PrometheusRule
                  created for this RouteMonitor
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
              routeURL:
                description: RouteURL is the url extracted from the Route resource
                type: string
              serviceMonitorRef:
                description: ServiceMonitorRef contains the reference to the ServiceMonitor
                  created for this RouteMonitor
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
